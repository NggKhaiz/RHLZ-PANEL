name: rhlz-panel
services:
  - name: web
    type: web
    ports:
      - port: 6767
    env:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "6767"
      - key: JWT_SECRET
        value: ""
    health_checks:
      - port: 6767
        path: /api/health
    routes:
      - path: /
